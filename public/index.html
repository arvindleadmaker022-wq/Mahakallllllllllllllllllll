<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Mail Console</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="password-gate" class="password-gate">
        <div class="gate-card">
            <h2>Access Console</h2>
            <p>Enter your password to continue</p>
            <form id="gate-form">
                <div id="gate-error" class="gate-error hidden">Incorrect Password</div>
                <input type="password" id="gate-password" placeholder="Password" required>
                <button type="submit" id="gate-submit-btn" class="btn btn-primary btn-block">Enter</button>
            </form>
        </div>
    </div>

    <div id="main-app" class="app-container hidden">
        <header class="app-header">
            <h1><i class="fa-solid fa-paper-plane"></i> Secure Mail Console</h1>
            <button id="logout-btn" class="btn btn-danger">Logout</button>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <h2>Email Composer</h2>
                <form id="composer-form">
                    <div class="form-group">
                        <label>Sender Name</label>
                        <input type="text" id="sender-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Sender Gmail</label>
                        <input type="email" id="dashboard-email" placeholder="your-email@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Gmail App Password (16 chars)</label>
                        <input type="password" id="dashboard-password" placeholder="xxxx xxxx xxxx xxxx" required>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="subject" placeholder="Your Subject" required>
                    </div>
                    <div class="form-group">
                        <label>Message Body</label>
                        <textarea id="message-body" placeholder="Hello {Name}, write your message here..." required></textarea>
                    </div>
                </form>
            </div>

            <div class="card">
                <h2>Recipients & Control</h2>
                <div class="form-group">
                    <label>Recipients List (<span id="detected-count">0 found</span>)</label>
                    <textarea id="recipients-input" placeholder="Paste emails here (one per line)"></textarea>
                    <div id="email-validation-error" class="error-message hidden">No valid emails found</div>
                </div>

                <div class="stats-grid" style="display:grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-bottom: 1rem;">
                    <div class="stat-box" style="padding:1rem; border:1px solid #ccc; border-radius:8px;">
                        <span class="stat-label">Total</span>
                        <div id="stat-total" class="stat-value">0</div>
                    </div>
                    <div class="stat-box" style="padding:1rem; border:1px solid #ccc; border-radius:8px;">
                        <span class="stat-label">Sent</span>
                        <div id="stat-sent" class="stat-value" style="color:green;">0</div>
                    </div>
                </div>

                <div class="control-buttons" style="display: flex; gap: 1rem;">
                    <button id="send-btn" class="btn btn-primary btn-block"><i class="fa-solid fa-paper-plane"></i> Send All</button>
                    <button id="stop-btn" class="btn btn-danger btn-block hidden">Stop</button>
                </div>
                <div id="status-text" style="margin-top: 1rem; font-weight: 500; text-align: center;">Ready</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
