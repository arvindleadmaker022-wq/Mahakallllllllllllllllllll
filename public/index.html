<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Mail Console</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Secure Mail Console</h1>
      <p>Inbox-Optimized High Speed Dispatcher</p>
    </header>
    
    <div id="auth-section" class="card">
      <h2>Access Authentication</h2>
      <input type="password" id="site-password" placeholder="Enter Access Password">
      <button id="auth-btn">Unlock Console</button>
    </div>

    <div id="app-section" class="card hidden">
      <h2>SMTP Configuration & Campaign</h2>
      <div class="form-group">
        <label>Gmail Address:</label>
        <input type="email" id="smtp-email" placeholder="your-email@gmail.com">
      </div>
      <div class="form-group">
        <label>App Password (16-chars):</label>
        <input type="password" id="smtp-pass" placeholder="xxxx xxxx xxxx xxxx">
      </div>
      <div class="form-group">
        <label>Sender Name:</label>
        <input type="text" id="sender-name" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Subject (Spintax Supported):</label>
        <input type="text" id="email-subject" placeholder="{Quick question|Site feedback}">
      </div>
      <div class="form-group">
        <label>Message Body (HTML / Spintax Supported):</label>
        <textarea id="email-body" rows="6" placeholder="{Hi {Name},|Hello {Name},}\n\nYour message here..."></textarea>
      </div>
      <div class="form-group">
        <label>Recipients (One per line or CSV):</label>
        <textarea id="recipients-list" rows="5" placeholder="client1@example.com, Client Name\nclient2@example.com"></textarea>
      </div>
      
      <div class="button-group">
        <button id="verify-btn">Verify SMTP</button>
        <button id="send-btn" class="primary">Start Sending</button>
        <button id="stop-btn" class="danger">Stop Campaign</button>
      </div>

      <div id="live-log" class="log-box"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
