<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Mail Console - Bulk Outreach</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Secure Mail Console</h1>
      <p class="subtitle">Inbox-Optimized Outreach Engine</p>
    </header>

    <div id="authSection" class="card">
      <h2>Enter Access Password</h2>
      <form id="authForm">
        <div class="form-group">
          <input type="password" id="sitePassword" placeholder="Enter site password..." required>
        </div>
        <button type="submit" class="btn">Authenticate</button>
      </form>
    </div>

    <div id="appSection" class="card" style="display: none;">
      <div class="smtp-status-box">
        <h3>Gmail SMTP Configuration</h3>
        <form id="verifyForm">
          <div class="form-group">
            <label for="smtpEmail">Gmail Address:</label>
            <input type="email" id="smtpEmail" placeholder="your-email@gmail.com" required>
          </div>
          <div class="form-group">
            <label for="appPassword">16-Char App Password:</label>
            <input type="password" id="appPassword" placeholder="abcd efgh ijkl mnop" maxlength="19" required>
          </div>
          <button type="button" id="verifyBtn" class="btn secondary">Verify SMTP</button>
        </form>
        <div id="verifyStatus" class="inline-status"></div>
      </div>

      <hr class="divider">

      <form id="emailForm">
        <div class="form-group">
          <label for="senderName">Sender Name:</label>
          <input type="text" id="senderName" placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="recipients">Recipients (One per line or Name &lt;email&gt;):</label>
          <textarea id="recipients" rows="5" placeholder="john@example.com&#10;Sarah &lt;sarah@example.com&gt;" required></textarea>
        </div>

        <div class="form-group">
          <label for="subject">Subject Line (Spintax supported: {Hello|Hi} {Name}):</label>
          <input type="text" id="subject" placeholder="{Quick question|Site Overview|Checking in}">
        </div>

        <div class="form-group">
          <label for="messageBody">Message Body / Variations (HTML or Text):</label>
          <textarea id="messageBody" rows="8" placeholder="Hi {FirstName}, your site looks great..." required></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" id="sendBtn" class="btn">Start Sending</button>
          <button type="button" id="stopBtn" class="btn danger" style="display: none;">Stop Campaign</button>
        </div>
      </form>

      <div id="progressContainer" class="progress-box" style="display: none;">
        <div class="progress-info">
          <span id="progressText">Progress: 0 / 0</span>
          <span id="statusText">Running...</span>
        </div>
        <div class="progress-bar-wrapper">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div id="logContainer" class="log-box" style="display: none;">
        <h4>Live Logs</h4>
        <div id="logContent"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
