<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Dispatch Pro | Professional Mail Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* Password Gate Overlay */
        .password-gate {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
        }
        .gate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%; max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .gate-icon {
            font-size: 2rem; color: var(--primary);
            background: #eff6ff; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; margin: 0 auto 1.25rem auto;
        }
        .gate-card h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.3rem; }
        .gate-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }

        /* Main Container */
        .app-container { max-width: 1350px; margin: 0 auto; }

        /* Header */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            border-radius: var(--radius);
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .brand-flex { display: flex; align-items: center; gap: 1rem; }
        .brand-logo {
            width: 45px; height: 45px; background: #eff6ff; color: var(--primary);
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;
        }
        .brand-info h1 { font-size: 1.3rem; font-weight: 700; color: #0f172a; }
        .live-status { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
        .pulse-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 1.5rem;
        }
        .column-right { display: flex; flex-direction: column; gap: 1.5rem; }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.25rem;
        }
        .card-title {
            display: flex; align-items: center; gap: 0.6rem;
            color: var(--primary); font-size: 1rem; font-weight: 600;
        }
        .card-title h3 { color: #0f172a; font-size: 1.05rem; }

        /* Form Controls */
        .form-row { display: flex; gap: 1rem; }
        .form-group { margin-bottom: 1.15rem; flex: 1; }
        .form-group.full { width: 100%; }
        .form-group label {
            display: block; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-muted); margin-bottom: 0.4rem;
        }
        .form-group label code { color: var(--primary); text-transform: none; font-size: 0.75rem; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; }

        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%; padding: 0.75rem 0.9rem;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-main); font-family: inherit; font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        textarea { resize: vertical; min-height: 100px; }
        #message-body { min-height: 140px; }
        #recipients-input { min-height: 150px; }

        .password-wrap { position: relative; display: flex; align-items: center; }
        .password-wrap input { padding-right: 2.5rem; }
        .toggle-pass {
            position: absolute; right: 10px; background: none; border: none;
            color: var(--text-muted); cursor: pointer; font-size: 0.9rem;
        }
        .toggle-pass:hover { color: var(--text-main); }

        .badge-count {
            background: #eff6ff; color: var(--primary);
            padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
        }
        .help-text { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.75rem; }

        /* Stats Grid */
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-bottom: 1rem;
        }
        .stat-box {
            background: #f8fafc; border: 1px solid var(--border-color);
            padding: 0.6rem; border-radius: 8px; text-align: center;
        }
        .stat-label {
            display: block; font-size: 0.6rem; text-transform: uppercase;
            color: var(--text-muted); font-weight: 700; margin-bottom: 2px;
        }
        .stat-val { font-size: 1.1rem; font-weight: 700; color: #0f172a; }
        .stat-box.success .stat-val { color: var(--success); }
        .stat-box.danger .stat-val { color: var(--danger); }
        .stat-box.warning .stat-val { color: var(--warning); }

        /* Progress Bar */
        .progress-track {
            background: #f1f5f9; height: 6px; border-radius: 3px;
            overflow: hidden; margin-bottom: 0.75rem; border: 1px solid var(--border-color);
        }
        .progress-bar-fill {
            background: var(--primary); height: 100%; width: 0%;
            transition: width 0.3s ease;
        }

        .status-row {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.78rem; color: var(--text-muted); margin-bottom: 1rem;
        }
        .status-dot-idle { color: #cbd5e1; font-size: 6px; }

        /* Live Terminal Logs */
        .logs-box {
            background: #0f172a; color: #38bdf8; padding: 12px;
            border-radius: 8px; font-family: monospace; font-size: 0.78rem;
            max-height: 150px; overflow-y: auto; margin-bottom: 1rem;
            border: 1px solid #1e293b;
        }
        .log-item { margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .log-success { color: #34d399; }
        .log-error { color: #f87171; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.75rem 1.25rem; border: none; border-radius: 8px;
            font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; box-shadow: 0 2px 4px rgba(37,99,235,0.2); }
        .btn-success { background: var(--success); color: #fff; flex: 1; box-shadow: 0 2px 4px rgba(16,185,129,0.2); }
        .btn-danger { background: var(--danger); color: #fff; flex: 1; box-shadow: 0 2px 4px rgba(239,68,68,0.2); }
        .btn:hover { filter: brightness(1.05); }

        .btn-logout {
            background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2;
            padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 5px;
        }
        .btn-logout:hover { background: #fee2e2; }

        .action-buttons { display: flex; gap: 0.75rem; }
        .error-banner {
            color: #dc2626; font-size: 0.78rem; margin-bottom: 0.75rem;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            background: #fef2f2; padding: 6px; border-radius: 6px;
        }
        .cloudflare-box {
            background: #f8fafc; padding: 10px; border-radius: 8px;
            border: 1px solid var(--border-color); margin-top: 0.5rem;
        }
        .cloudflare-box label { display: flex; align-items: center; gap: 5px; color: var(--primary); font-size: 0.72rem; }

        .hidden { display: none !important; }
        @media (max-width: 968px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <!-- Password Gate Overlay -->
    <div id="password-gate" class="password-gate">
        <div class="gate-card">
            <div class="gate-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Authentication Required</h2>
            <p>Enter security key to access dispatch console</p>
            <form id="gate-form" autocomplete="off" onsubmit="return false;">
                <div class="form-group full">
                    <div class="password-wrap">
                        <input type="password" id="gate-password" placeholder="Security key..." autocomplete="current-password" required>
                        <button type="button" id="toggle-gate-password" class="toggle-pass">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div id="gate-error" class="error-banner hidden">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Invalid Security Key</span>
                </div>
                <button type="submit" id="gate-submit-btn" class="btn btn-primary">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
                </button>
            </form>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="app-container hidden" id="main-app">
        <header class="app-header">
            <div class="brand-flex">
                <div class="brand-logo">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <div class="brand-info">
                    <h1>Neural Dispatch Pro</h1>
                    <div class="live-status">
                        <span class="pulse-dot"></span> Professional Email Outreach Console
                    </div>
                </div>
            </div>
            <button type="button" id="logout-btn" class="btn-logout" title="Double click to logout">
                <i class="fa-solid fa-power-off"></i> <span>Logout (2x)</span>
            </button>
        </header>

        <main class="dashboard-grid">
            <!-- Left Card: Message Synthesizer -->
            <section class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-pen-nib"></i>
                        <h3>Message Composer & Spintax</h3>
                    </div>
                </div>
                <form id="compose-form" onsubmit="return false;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="sender-name">Sender Name / Alias</label>
                            <input type="text" id="sender-name" placeholder="John Doe" required spellcheck="false">
                        </div>
                        <div class="form-group">
                            <label for="dashboard-email">Gmail Address</label>
                            <input type="email" id="dashboard-email" placeholder="your-email
